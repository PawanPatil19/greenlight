# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen
# Change bundleIdPrefix, DEVELOPMENT_TEAM and the App Group to your own before running on a device.
name: Greenlight
options:
  bundleIdPrefix: dev.greenlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "" # your Apple team id
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GreenlightKit:
    path: GreenlightKit
targets:
  Greenlight:
    type: application
    platform: iOS
    sources: [Greenlight, Shared]
    scheme: {}
    dependencies:
      - package: GreenlightKit
      - target: GreenlightWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.greenlight.app
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Greenlight/Info.plist
      properties:
        CFBundleDisplayName: Greenlight
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: dev.greenlight.app
            CFBundleURLSchemes: [greenlight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Greenlight talks to the relay running on your computer.
        NSFaceIDUsageDescription: Greenlight asks for Face ID before approving risky actions.
    entitlements:
      path: Greenlight/Greenlight.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.dev.greenlight.app]
  GreenlightWidgets:
    type: app-extension
    platform: iOS
    sources: [GreenlightWidgets, Shared]
    dependencies:
      - package: GreenlightKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.greenlight.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: GreenlightWidgets/Info.plist
      properties:
        CFBundleDisplayName: Greenlight
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: GreenlightWidgets/GreenlightWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.greenlight.app]
