name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      plugin: ${{ steps.filter.outputs.plugin }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relay:
              - 'relay/**'
              - 'plugin/**'
              - 'docs/protocol.md'
              - '.github/workflows/ci.yml'
            plugin:
              - 'plugin/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check

  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: plugin/scripts/validate.sh

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    # GreenlightKit (models, relay client, widget rules) is Foundation-only, so it
    # builds and tests on Linux. The app and widget targets need Xcode and signing
    # and are built on a Mac (see ios/README.md).
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path ios/GreenlightKit

  # Compiles the app and widget targets for the simulator, unsigned. Catches Swift
  # errors in code that can't build on Linux. Runs only when ios/ changes.
  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen
      - run: |
          xcodebuild build -project Greenlight.xcodeproj -scheme Greenlight \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
          exit ${PIPESTATUS[0]}

  # Single check to require in branch protection. Passes when every job that
  # ran succeeded and the skipped ones were skipped on purpose.
  required:
    if: always()
    needs: [changes, relay, plugin, ios, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
