name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      plugin: ${{ steps.filter.outputs.plugin }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relay:
              - 'relay/**'
              - 'docs/protocol.md'
              - '.github/workflows/ci.yml'
            plugin:
              - 'plugin/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check

  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: plugin/scripts/validate.sh

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Placeholder until the Xcode project exists. Then switch runs-on to
      # macos-15 and run xcodebuild test.
      - run: echo "No Xcode project yet; nothing to build."

  # Single check to require in branch protection. Passes when every job that
  # ran succeeded and the skipped ones were skipped on purpose.
  required:
    if: always()
    needs: [changes, relay, plugin, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
