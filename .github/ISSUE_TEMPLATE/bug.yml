name: Bug
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [relay, plugin, ios, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
