<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;background:#fbfbfd;color:#1d1d1f;padding:40px 44px 44px;width:max-content}
.title{font:600 26px/1.2 "Inter Display",Inter;letter-spacing:-.4px}
.subtitle{color:#6e6e73;font-size:14px;margin:6px 0 28px}
.cols{display:flex;gap:22px}
.col .lbl{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#6e6e73;margin:0 0 10px 4px}
.col .lbl b{color:#1d1d1f}
.wall{width:420px;border-radius:34px;padding:28px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.wall.light{background:radial-gradient(120% 80% at 0% 0%,#ffe7d6 0%,transparent 55%),radial-gradient(100% 90% at 100% 30%,#d9e6ff 0%,transparent 60%),radial-gradient(120% 90% at 30% 100%,#e8f6ec 0%,transparent 60%),#f3f1f7}
.wall.dark{background:radial-gradient(110% 70% at 0% 0%,#2a2340 0%,transparent 60%),radial-gradient(100% 80% at 100% 100%,#14303a 0%,transparent 60%),#0d0d12}
.wall.clear{background:radial-gradient(70% 45% at 15% 15%,#ff8a5c 0%,transparent 70%),radial-gradient(70% 50% at 90% 35%,#5b7cfa 0%,transparent 70%),radial-gradient(80% 55% at 25% 80%,#2fc4a6 0%,transparent 70%),radial-gradient(60% 40% at 85% 90%,#f2c14e 0%,transparent 70%),#6a5acd}
.wall.tinted{background:radial-gradient(70% 45% at 20% 10%,#1f5a43 0%,transparent 70%),radial-gradient(80% 60% at 90% 80%,#123a52 0%,transparent 70%),#081613}
.row{display:flex;gap:24px}

/* ---- widget shell ---- */
.w{position:relative;border-radius:24px;padding:16px;overflow:hidden;color:var(--fg)}
.m{width:364px;height:170px}.s{width:170px;height:170px}.l{width:364px;height:382px}
.light .w{--fg:#1d1d1f;--fg2:rgba(29,29,31,.58);--fg3:rgba(29,29,31,.38);--hair:rgba(0,0,0,.08);--panel:rgba(118,118,128,.08);--amber:#e8820c;--blue:#0a7aff;--green:#1fa64a;--red:#e5372c;--gray:#8e8e93;--pri:#1fa64a;--priFg:#fff;--sec:rgba(118,118,128,.13);--secFg:#1d1d1f;
  background:linear-gradient(180deg,#ffffff 0%,#f7f7fa 100%);box-shadow:0 1px 1px rgba(0,0,0,.04),0 8px 24px rgba(40,30,80,.10)}
.dark .w{--fg:#f5f5f7;--fg2:rgba(245,245,247,.6);--fg3:rgba(245,245,247,.36);--hair:rgba(255,255,255,.09);--panel:rgba(255,255,255,.06);--amber:#ffb340;--blue:#4aa3ff;--green:#3ddc74;--red:#ff6961;--gray:#98989d;--pri:#30d158;--priFg:#04210f;--sec:rgba(255,255,255,.1);--secFg:#f5f5f7;
  background:linear-gradient(180deg,#232327 0%,#18181b 100%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45)}
.clear .w,.tinted .w{backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.22),0 10px 30px rgba(0,0,0,.18)}
.clear .w::before,.tinted .w::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%)}
.clear .w{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(40,30,70,.10));--fg:#fff;--fg2:rgba(255,255,255,.72);--fg3:rgba(255,255,255,.5);--hair:rgba(255,255,255,.22);--panel:rgba(255,255,255,.14);--amber:#fff;--blue:#fff;--green:#fff;--red:#fff;--gray:rgba(255,255,255,.6);--pri:rgba(255,255,255,.92);--priFg:#2b2b33;--sec:rgba(255,255,255,.2);--secFg:#fff;text-shadow:0 1px 3px rgba(0,0,0,.22)}
.tinted .w{background:rgba(20,60,45,.30);--fg:#b9f5cf;--fg2:rgba(185,245,207,.68);--fg3:rgba(185,245,207,.45);--hair:rgba(185,245,207,.18);--panel:rgba(185,245,207,.10);--amber:#b9f5cf;--blue:#b9f5cf;--green:#b9f5cf;--red:#b9f5cf;--gray:rgba(185,245,207,.55);--pri:#b9f5cf;--priFg:#0c2a1c;--sec:rgba(185,245,207,.16);--secFg:#b9f5cf}
.w > *{position:relative}

/* ---- pieces ---- */
.brand{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--fg2)}
.sig{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--green) 22%,transparent)}
.stale{font-size:10.5px;color:var(--fg3);font-weight:500}
.num{font:600 56px/0.9 "Inter Display",Inter;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.cap{font-size:13px;font-weight:600;letter-spacing:-.1px}
.sub{font-size:11.5px;color:var(--fg2);font-weight:500}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:-.2px}
.panel{background:var(--panel);border-radius:14px;padding:10px 11px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--c)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:600;letter-spacing:-.1px}
.btn.p{background:var(--pri);color:var(--priFg)}
.btn.s{background:var(--sec);color:var(--secFg)}
.btn svg{width:11px;height:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;margin-top:5px}
.dot.live{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.srow{display:flex;gap:9px;padding:7px 0;border-top:.5px solid var(--hair)}
.srow:first-child{border-top:0;padding-top:0}
.srow .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .t span{color:var(--fg2);font-weight:500}
.srow .st{font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .when{margin-left:auto;font-size:10.5px;color:var(--fg3);flex:none;padding-top:2px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockcol .wall{gap:14px}
</style></head><body>
<div class="title" id="title"></div><div class="subtitle" id="subtitle"></div>
<div class="cols" id="cols"></div>
<script>
const P = new URLSearchParams(location.search);
const page = P.get("page") || "home";
const ico = {
  play:'<svg viewBox="0 0 12 12"><path d="M3 1.8v8.4c0 .5.5.8.9.5l6.3-4.2c.4-.2.4-.8 0-1L3.9 1.3c-.4-.3-.9 0-.9.5z" fill="currentColor"/></svg>',
  x:'<svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  lock:'<svg viewBox="0 0 12 12"><rect x="2" y="5.2" width="8" height="5.6" rx="1.4" fill="currentColor"/><path d="M3.8 5.4V4a2.2 2.2 0 014.4 0v1.4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>',
  pause:'<svg viewBox="0 0 12 12"><rect x="2.6" y="2" width="2.4" height="8" rx=".8" fill="currentColor"/><rect x="7" y="2" width="2.4" height="8" rx=".8" fill="currentColor"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="30" height="30"><circle cx="12" cy="12" r="11" fill="var(--green)"/><path d="M7 12.4l3.2 3.1L17.2 8.6" stroke="var(--priFg)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const brand = (right='') => `<div style="display:flex;justify-content:space-between;align-items:center"><div class="brand"><i class="sig"></i>Greenlight</div><div class="stale">${right}</div></div>`;

const mediumAsk = () => `<div class="w m" style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px">
  <div style="display:flex;flex-direction:column">
    <div class="brand"><i class="sig"></i>Greenlight</div>
    <div class="num" style="color:var(--amber);margin-top:14px">1</div>
    <div class="cap" style="margin-top:6px">needs you</div>
    <div class="sub" style="margin-top:auto">2 running</div>
  </div>
  <div class="panel" style="display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:6px"><div class="cap ell" style="font-size:12.5px">greenlight <span style="color:var(--fg2);font-weight:500">· main</span></div><span class="chip" style="--c:var(--amber);margin-left:auto;flex:none"><i></i>Medium</span></div>
    <div class="sub" style="margin-top:6px">Run a shell command?</div>
    <div class="mono ell" style="margin-top:3px"><span style="color:var(--fg3)">$ </span>npm test -- auth</div>
    <div style="display:flex;gap:6px;margin-top:auto"><span class="btn p" style="flex:1">${ico.play}Run</span><span class="btn s" style="flex:1">Deny</span></div>
  </div></div>`;

const mediumIdle = () => `<div class="w m" style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px">
  <div style="display:flex;flex-direction:column">
    <div class="brand"><i class="sig"></i>Greenlight</div>
    <div style="margin-top:16px">${ico.check}</div>
    <div class="cap" style="margin-top:8px">All clear</div>
    <div class="sub" style="margin-top:auto">Updated 1m ago</div>
  </div>
  <div style="padding-top:1px">
    ${[["running","greenlight","main","Running npm test","now",true],["running","api","fix/rate-limit","Editing src/limits.ts","2m",true],["done","docs","main","Rewrote the setup guide","1h",false]].map(([s,r,b,st,w,live])=>`
    <div class="srow"><i class="dot ${live?'live':''}" style="--c:var(--${s==='done'?'green':'blue'})"></i><div style="min-width:0"><div class="t">${r} <span>· ${b}</span></div><div class="st">${st}</div></div><div class="when">${w}</div></div>`).join("")}
  </div></div>`;

const smallNeeds = () => `<div class="w s" style="display:flex;flex-direction:column">
  ${brand()}
  <div class="num" style="color:var(--amber);margin-top:14px">1</div>
  <div class="cap" style="margin-top:6px">needs you</div>
  <div style="margin-top:auto"><div class="sub ell" style="color:var(--fg)">greenlight · main</div><div class="sub ell">Run a shell command?</div></div>
</div>`;

const smallClear = () => `<div class="w s" style="display:flex;flex-direction:column">
  ${brand()}
  <div style="margin-top:16px">${ico.check}</div>
  <div class="cap" style="margin-top:9px;font-size:15px">All clear</div>
  <div class="sub" style="margin-top:auto">2 running · 1 done</div>
</div>`;

const large = () => `<div class="w l" style="display:flex;flex-direction:column">
  ${brand('Updated just now')}
  <div style="display:flex;align-items:baseline;gap:8px;margin-top:12px"><div class="num" style="font-size:40px;color:var(--amber)">1</div><div class="cap" style="font-size:15px">needs you</div></div>
  <div class="panel" style="margin-top:12px">
    <div style="display:flex;align-items:center"><div class="cap ell">greenlight <span style="color:var(--fg2);font-weight:500">· main</span></div><span class="chip" style="--c:var(--red);margin-left:auto"><i></i>High risk</span></div>
    <div class="sub" style="margin-top:6px">Run a shell command?</div>
    <div class="mono" style="margin-top:4px;line-height:1.45"><span style="color:var(--fg3)">$ </span>git push origin fix/flaky-login</div>
    <div style="display:flex;gap:6px;margin-top:11px"><span class="btn p" style="flex:1">${ico.lock}Review in app</span><span class="btn s">Deny</span></div>
  </div>
  <div style="margin-top:14px">
    ${[["blue","api","fix/rate-limit","Editing src/limits.ts","2m",true],["red","infra","main","Failed: 3 tests did not pass","8m",false],["green","docs","main","Rewrote the setup guide","1h",false]].map(([c,r,b,st,w,live])=>`
    <div class="srow"><i class="dot ${live?'live':''}" style="--c:var(--${c})"></i><div style="min-width:0"><div class="t">${r} <span>· ${b}</span></div><div class="st">${st}</div></div><div class="when">${w}</div></div>`).join("")}
  </div>
  <div style="display:flex;align-items:center;margin-top:auto"><span class="btn s" style="height:28px;font-size:12px">${ico.pause}Pause all</span><span class="sub" style="margin-left:auto">1 running · 1 failed · 1 done</span></div>
</div>`;

const lock = () => `<div style="text-align:center;color:#fff;padding-top:6px">
   <div style="font-size:16px;font-weight:600;opacity:.9">Tuesday 20 October</div>
   <div style="font:600 92px/1 'Inter Display';letter-spacing:-3px;margin-top:4px">9:41</div></div>
   <div style="display:flex;gap:12px;justify-content:center;color:#fff;margin-top:4px">
     <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);display:grid;place-items:center;position:relative">
       <svg width="72" height="72" style="position:absolute;inset:0"><circle cx="36" cy="36" r="29" stroke="rgba(255,255,255,.25)" stroke-width="5" fill="none"/><circle cx="36" cy="36" r="29" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${2*Math.PI*29*0.25} 999" transform="rotate(-90 36 36)"/></svg>
       <div style="text-align:center;line-height:1"><div style="font:600 24px 'Inter Display'">1</div><div style="font-size:8.5px;font-weight:600;letter-spacing:.4px;opacity:.8;margin-top:2px">NEEDS</div></div></div>
     <div style="width:172px;height:72px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);padding:9px 12px;text-align:left">
       <div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px"><i style="width:8px;height:8px;border-radius:50%;background:#fff"></i>1 needs you</div>
       <div style="font-size:12px;font-weight:600;margin-top:3px;opacity:.95">greenlight · main</div>
       <div style="font-size:11.5px;opacity:.75">Run a shell command?</div></div>
   </div>
   <div style="margin-top:auto;background:rgba(255,255,255,.2);backdrop-filter:blur(30px) saturate(160%);border-radius:22px;padding:12px 14px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)">
     <div style="display:flex;align-items:center;gap:8px"><div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,#3ddc74,#16a34a);display:grid;place-items:center"><i style="width:9px;height:9px;border-radius:50%;background:#fff"></i></div>
       <div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600">greenlight · main<span style="opacity:.6;font-weight:500;font-size:12px">now</span></div><div style="font-size:13px;opacity:.9">Run a shell command?</div></div></div>
   </div>
   <div style="display:flex;gap:8px;color:#fff;font-size:13px;font-weight:600"><div style="flex:1;text-align:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(30px)">Allow</div><div style="flex:1;text-align:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(30px);color:#ffb4ad">Deny</div></div>`;

const themes = [["light","Light"],["dark","Dark"],["clear","Clear glass"],["tinted","Tinted glass"]];
const cols = document.getElementById("cols");
if (page === "home") {
  document.getElementById("title").textContent = "Greenlight widgets";
  document.getElementById("subtitle").textContent = "Medium and small widgets in each Home Screen look. Clear and tinted are the iOS 26 Liquid Glass modes. Drawn from the SwiftUI code with sample data.";
  cols.innerHTML = themes.map(([k,n]) => `<div class="col"><div class="lbl"><b>${n}</b></div><div class="wall ${k}">${mediumAsk()}<div class="row">${smallNeeds()}${smallClear()}</div>${mediumIdle()}</div></div>`).join("");
} else {
  document.getElementById("title").textContent = "Large widget and Lock Screen";
  document.getElementById("subtitle").textContent = "High-risk commands never get a one-tap Run: the button opens the app, where approving needs Face ID. The Lock Screen shows the question, never the command.";
  cols.innerHTML = themes.slice(0,3).map(([k,n]) => `<div class="col"><div class="lbl"><b>${n}</b> · large</div><div class="wall ${k}">${large()}</div></div>`).join("")
   + `<div class="col lockcol"><div class="lbl"><b>Lock Screen</b> · widgets and notification</div><div class="wall dark" style="height:438px">${lock()}</div></div>`;
}
</script></body></html>
